server:
  port: 19096

spring:
  application:
    name: product-service

  datasource:
    url: jdbc:postgresql://localhost:5432/eleven-logistics-product
    username: eleven-logistics
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6379
      username: default
      password: 1234

eureka:
  client:
    service-url:
      defaultZone: http://localhost:19090/eureka/

management:
  zipkin:
    tracing:
      endpoint: "http://localhost:9411/api/v2/spans"
  tracing:
    sampling:
      probability: 1.0

# 모놀리식에서 문서를 출력할 경우 아래 설정을 해주어야하지만,
# MSA 환경에서는 각 서비스가 swagger-ui를 생성할 필요는 없기 때문에 아래 설정이 하지 않아도 됩니다.
springdoc:
  swagger-ui:
    enabled: true
    path: /docs
    url: /springdoc/openapi3-product-service.json
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    enabled: true
    path: /api-docs-product-service