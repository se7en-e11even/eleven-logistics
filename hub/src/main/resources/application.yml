spring:
  application:
    name: hub-service
  data:
    redis:
      host: localhost
      port: 6379
      username: default
      password: 1234
  sql:
    init:
      mode: never
      schema-locations: classpath:db/schema.sql

  datasource:
    url: jdbc:postgresql://localhost:5432/eleven-logistics-hub
    username: eleven-logistics
    password: 1234
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update


server:
  port: 19093

management:
  zipkin:
    tracing:
      endpoint: "http://localhost:9411/api/v2/spans"
  tracing:
    sampling:
      probability: 1.0

naver:
  geocode-url: ${NAVER_Url}
  client-id: ${NAVER_Client}
  client-secret: ${NAVER_Secret}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:19090/eureka/
springdoc:
  api-docs:
    enabled: true
    path: /hub-service/v3/api-docs
  swagger-ui:
    path: /hub-service/swagger-ui.html


