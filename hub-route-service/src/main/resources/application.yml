server:
  port: 19097

spring:
  application:
    name: hub-route-service
  datasource:
    url: jdbc:postgresql://localhost:5432/eleven-logistics-hub-route
    username: eleven-logistics
    password: 1234
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: localhost  # Redis 서버 주소
      port: 6379       # Redis 기본 포트
      username: default
      password: 1234
  rabbitmq:
    host: 129.154.192.198
    port: 5672
    username: eleven-logistics
    password: eleven-logistics
    listener:
      simple: # exchange 옵션에 따라 다르다!
        default-requeue-rejected: false



  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:19090/eureka/


message:
  # [Delivery Service]
  exchange: delivery
  queue:
    hubroute: delivery.hubroute





